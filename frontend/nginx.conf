# Sirve el frontend y reenvía /api/ al API Gateway (misma dirección: sin CORS ni HTTPS mezclado)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker resuelve los nombres de los contenedores; con variable nginx arranca aunque el gateway tarde
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $gateway http://ms-gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
        # El sitio y la API comparten dirección (no hay CORS). Sin esto el navegador envía "Origin: https://..."
        # y el gateway, que solo conoce localhost, responde 403 "Invalid CORS request".
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
