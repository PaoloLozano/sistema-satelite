<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos — Sistema Satélite</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <script src="../assets/js/core/theme.js?v=2"></script>
</head>
<body>
<div class="sat-layout">
<aside class="barra-lateral" id="sidebar"></aside>

<header class="barra-superior">
  <div class="d-flex align-items-center gap-3">
    <div class="topbar-title">Productos</div>
  </div>
  <div class="barra-derecha">
    <button class="boton-tema" id="btn-tema" onclick="toggleTema()" title="Cambiar tema" aria-label="Cambiar tema">
      <i class="bi bi-moon" id="icono-luna"></i>
      <i class="bi bi-sun" id="icono-sol" style="display:none"></i>
    </button>
    <a href="importar.html" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-upload me-1"></i>Importar
    </a>
    <button class="btn btn-danger btn-sm" onclick="openNew()">+ Nuevo producto</button>
  </div>
</header>

<main class="sat-content">
  <div class="mb-3">
    <div class="page-eyebrow">CATÁLOGO</div>
    <h1 class="page-heading">Catálogo de productos</h1>
    <p class="page-sub">Todos los productos registrados con su EAN-13, stock y precio actual · <span id="today-date"></span></p>
  </div>

  <div class="barra-filtros">
    <div class="contenedor-busqueda">
      <i class="bi bi-search text-muted"></i>
      <input type="text" id="search" placeholder="Buscar por nombre, EAN o categoría…" oninput="filterProds(this.value)">
    </div>
    <button class="chip-categoria active" data-cat="TODAS"     onclick="setCat('TODAS')">Todos</button>
    <button class="chip-categoria"        data-cat="Lácteos"   onclick="setCat('Lácteos')">Lácteos</button>
    <button class="chip-categoria"        data-cat="Panadería" onclick="setCat('Panadería')">Panadería</button>
    <button class="chip-categoria"        data-cat="Abarrotes" onclick="setCat('Abarrotes')">Abarrotes</button>
    <button class="chip-categoria"        data-cat="Limpieza"  onclick="setCat('Limpieza')">Limpieza</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="exportCSV()">
      <i class="bi bi-download me-1"></i>CSV
    </button>
  </div>

  <div class="d-flex align-items-center justify-content-between mb-3 small text-muted">
    <span><span id="total-count">0</span> productos</span>
  </div>

  <div id="grilla-productos" class="grilla-productos"></div>
</main>
</div>

<!-- MODAL Producto -->
<div class="fondo-modal" id="prod-modal">
  <div class="sat-modal">
    <div class="modal-header-dark"><h3 id="modal-title">Nuevo producto</h3><button class="modal-close-btn" onclick="closeModal('prod-modal')">✕</button></div>
    <div class="modal-body">
      <form id="prod-form" onsubmit="return false">
      <div class="grilla-formulario">
        <div class="mb-3 grupo-campo full">
          <label class="form-label fw-semibold">Nombre del producto *</label>
          <input type="text" class="form-control" id="prod-nombre" placeholder="Leche Gloria Entera 1L">
        </div>
        <div class="mb-3 grupo-campo">
          <label class="form-label fw-semibold">EAN-13 *</label>
          <input type="text" class="form-control" id="codigo-producto" placeholder="7751519000017" maxlength="13">
          <div class="ean-error-msg text-danger small mt-1" id="ean-error">Debe tener 13 dígitos.</div>
        </div>
        <div class="mb-3 grupo-campo">
          <label class="form-label fw-semibold">Categoría *</label>
          <select class="form-select" id="categoria-producto">
            <option value="">— Seleccionar —</option>
            <option>Lácteos</option><option>Panadería</option><option>Abarrotes</option>
            <option>Limpieza</option><option>Bebidas</option><option>Snacks</option>
            <option>Aceites</option><option>Granos</option><option>Azúcares</option>
            <option>Fideos</option><option>Condimentos</option><option>Carnes</option>
          </select>
        </div>
        <div class="mb-3 grupo-campo full">
          <label class="form-label fw-semibold">Proveedor</label>
          <select class="form-select" id="proveedor-producto">
            <option value="">— Seleccionar proveedor —</option>
          </select>
        </div>
        <div class="mb-3 grupo-campo">
          <label class="form-label fw-semibold">Stock actual (und) *</label>
          <input type="number" class="form-control" id="stock-producto" placeholder="100" min="0">
        </div>
        <div class="mb-3 grupo-campo">
          <label class="form-label fw-semibold">Costo unitario S/ *</label>
          <input type="number" class="form-control" id="prod-precio" placeholder="3.40" step="0.01" min="0">
        </div>
        <div class="mb-3 grupo-campo full">
          <label class="form-label fw-semibold">Stock mínimo (und)</label>
          <input type="number" class="form-control" id="stock-productomin" placeholder="20" min="0">
        </div>
      </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline-secondary" onclick="closeModal('prod-modal')">Cancelar</button>
      <button class="btn btn-danger" onclick="saveProd()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL Confirmar eliminación -->
<div class="fondo-modal" id="delete-modal">
  <div class="sat-modal" style="max-width:400px">
    <div class="modal-header-dark"><h3>Eliminar producto</h3><button class="modal-close-btn" onclick="closeModal('delete-modal')">✕</button></div>
    <div class="modal-body">
      <p class="small">¿Estás seguro de que deseas eliminar <strong id="delete-name"></strong>?</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline-secondary" onclick="closeModal('delete-modal')">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Eliminar</button>
    </div>
  </div>
</div>

<div id="contenedor-avisos"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/core/config.js"></script>
<script src="../assets/js/core/auth.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/utils/format.js"></script>
<script src="../assets/js/components/sidebar.js"></script>
<script src="../assets/js/pages/productos.js"></script>
</body>
</html>
