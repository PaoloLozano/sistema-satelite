<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Precios — Sistema Satélite</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <script src="../assets/js/core/theme.js?v=2"></script>
</head>
<body>
<div class="sat-layout">
<aside class="barra-lateral" id="sidebar"></aside>

<header class="barra-superior">
  <div class="d-flex align-items-center gap-3">
    <div class="topbar-title">Ranking de precios</div>
  </div>
  <div class="barra-derecha">
    <button class="boton-tema" id="btn-tema" onclick="toggleTema()" title="Cambiar tema" aria-label="Cambiar tema">
      <i class="bi bi-moon" id="icono-luna"></i>
      <i class="bi bi-sun" id="icono-sol" style="display:none"></i>
    </button>
    <a href="cotizaciones.html" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-upload me-1"></i>Nueva cotización
    </a>
  </div>
</header>

<main class="sat-content">
  <div class="mb-3">
    <div class="page-eyebrow">COMPARACIÓN DE PROVEEDORES</div>
    <h1 class="page-heading">Ranking de precios por producto</h1>
    <p class="page-sub">Compara el precio de cada producto entre todos los proveedores en el período seleccionado</p>
  </div>

  <div class="barra-controles">
    <div class="control-group" style="flex:1;min-width:180px">
      <div class="control-label">Producto</div>
      <select class="form-select" id="prod-select" onchange="loadRanking()">
        <option value="">— Seleccionar producto —</option>
        <option value="7751519000017">Leche Gloria Entera 1L</option>
        <option value="7751007005512">Arroz Costeño 5kg</option>
        <option value="7751007000012">Aceite Primor 1L</option>
      </select>
    </div>
    <div class="control-group">
      <div class="control-label">Desde</div>
      <input type="date" class="form-control" id="date-from" onchange="loadRanking()">
    </div>
    <div class="control-group">
      <div class="control-label">Hasta</div>
      <input type="date" class="form-control" id="date-to" onchange="loadRanking()">
    </div>
    <div class="align-self-end">
      <button class="btn btn-danger btn-sm" onclick="loadRanking()">
        Actualizar
      </button>
    </div>
  </div>

  <!-- KPIs -->
  <div class="row g-3 mb-4" id="kpis-ranking" style="display:none">
    <div class="col-6">
      <div class="tarjeta-kpi kpi-green">
        <div class="kpi-label">Ahorro potencial</div>
        <div class="kpi-value" id="kpi-saving">—</div>
      </div>
    </div>
    <div class="col-6">
      <div class="tarjeta-kpi">
        <div class="kpi-label">Precio promedio</div>
        <div class="kpi-value kpi-brand" id="kpi-avg">—</div>
      </div>
    </div>
  </div>

  <!-- Ranking cards -->
  <div id="ranking-container"></div>
</main>
</div>

<div id="contenedor-avisos"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/core/config.js"></script>
<script src="../assets/js/core/auth.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/utils/format.js"></script>
<script src="../assets/js/components/sidebar.js"></script>
<script src="../assets/js/pages/ranking.js"></script>
</body>
</html>
