<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedores — Sistema Satélite</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <script src="../assets/js/core/theme.js?v=2"></script>
</head>
<body>
<div class="sat-layout">
<aside class="barra-lateral" id="sidebar"></aside>

<header class="barra-superior">
  <div class="d-flex align-items-center gap-3">
    <div class="topbar-title">Proveedores</div>
  </div>
  <div class="barra-derecha">
    <button class="boton-tema" id="btn-tema" onclick="toggleTema()" title="Cambiar tema" aria-label="Cambiar tema">
      <i class="bi bi-moon" id="icono-luna"></i>
      <i class="bi bi-sun" id="icono-sol" style="display:none"></i>
    </button>
    <button class="btn btn-danger btn-sm" onclick="openNew()">+ Nuevo proveedor</button>
  </div>
</header>

<main class="sat-content">
  <div class="mb-3">
    <div class="page-eyebrow">DIRECTORIO</div>
    <h1 class="page-heading">Proveedores registrados</h1>
    <p class="page-sub">Gestión de proveedores con datos de contacto y estadísticas · <span id="today-date"></span></p>
  </div>

  <div class="barra-filtros">
    <div class="contenedor-busqueda">
      <i class="bi bi-search text-muted"></i>
      <input type="text" id="search" placeholder="Buscar por nombre, RUC o contacto…" oninput="filterProvs(this.value)">
    </div>
    <span class="d-flex gap-1 ms-auto">
      <button class="chip-filtro active" data-vista="tarjetas" onclick="setVista('tarjetas')"><i class="bi bi-grid me-1"></i>Tarjetas</button>
      <button class="chip-filtro"        data-vista="tabla"    onclick="setVista('tabla')"><i class="bi bi-table me-1"></i>Tabla</button>
    </span>
    <span class="small text-muted"><span id="total-count">0</span> proveedores</span>
  </div>

  <div class="grilla-proveedores" id="grilla-proveedores"></div>
  <div class="table-responsive" id="tabla-proveedores" style="display:none">
    <table class="table table-hover align-middle">
      <thead class="table-light"><tr>
        <th>Proveedor</th><th>RUC</th><th>Contacto</th><th>Email</th><th>Teléfono</th>
        <th class="text-end">Productos</th><th class="text-end">Ahorro del mes</th><th></th>
      </tr></thead>
      <tbody id="proveedores-tbody"></tbody>
    </table>
  </div>
  <div id="paginacion" class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-4"></div>
</main>
</div>

<div class="fondo-modal" id="prov-modal">
  <div class="sat-modal">
    <div class="modal-header-dark"><h3 id="modal-title">Nuevo proveedor</h3><button class="modal-close-btn" onclick="closeModal('prov-modal')">✕</button></div>
    <div class="modal-body">
      <form id="prov-form" onsubmit="return false">
      <div class="grilla-formulario">
        <div class="mb-3 grupo-campo full">
          <label class="form-label fw-semibold">Nombre / Razón social *</label>
          <input type="text" class="form-control" id="prov-nombre" placeholder="Gloria S.A.">
        </div>
        <div class="mb-3 grupo-campo">
          <label class="form-label fw-semibold">RUC *</label>
          <input type="text" class="form-control" id="ruc-proveedor" placeholder="20100176851" maxlength="11">
        </div>
        <div class="mb-3 grupo-campo">
          <label class="form-label fw-semibold">Contacto</label>
          <input type="text" class="form-control" id="prov-contacto" placeholder="Juan Pérez">
        </div>
        <div class="mb-3 grupo-campo full">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" id="prov-email" placeholder="ventas@gloria.pe">
        </div>
        <div class="mb-3 grupo-campo full">
          <label class="form-label fw-semibold">Teléfono</label>
          <input type="tel" class="form-control" id="prov-tel" placeholder="01 3131200">
        </div>
        <div class="mb-3 grupo-campo full">
          <label class="form-label fw-semibold">Dirección</label>
          <input type="text" class="form-control" id="prov-dir" placeholder="Av. República de Panama 2461, Surquillo">
        </div>
      </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline-secondary" onclick="closeModal('prov-modal')">Cancelar</button>
      <button class="btn btn-danger" onclick="saveProv()">Guardar proveedor</button>
    </div>
  </div>
</div>

<div class="fondo-modal" id="delete-modal">
  <div class="sat-modal" style="max-width:400px">
    <div class="modal-header-dark"><h3>Confirmar eliminación</h3><button class="modal-close-btn" onclick="closeModal('delete-modal')">✕</button></div>
    <div class="modal-body">
      <p style="font-size:14px">¿Seguro que deseas eliminar al proveedor <strong id="delete-name"></strong>?</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline-secondary" onclick="closeModal('delete-modal')">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Sí, eliminar</button>
    </div>
  </div>
</div>

<div id="contenedor-avisos"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/core/config.js"></script>
<script src="../assets/js/core/auth.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/utils/format.js"></script>
<script src="../assets/js/components/sidebar.js"></script>
<script src="../assets/js/pages/proveedores.js"></script>
</body>
</html>
