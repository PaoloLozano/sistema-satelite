<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semáforo de Caducidad — Sistema Satélite</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <script src="../assets/js/core/theme.js?v=2"></script>
</head>
<body>

<div class="sat-layout">
  <aside class="barra-lateral" id="sidebar"></aside>

  <header class="barra-superior">
    <div class="d-flex align-items-center gap-3">
      <div class="topbar-title">Semáforo de Caducidad</div>
    </div>
    <div class="barra-derecha">
      <button class="boton-tema" id="btn-tema" onclick="toggleTema()" title="Cambiar tema" aria-label="Cambiar tema">
        <i class="bi bi-moon" id="icono-luna"></i>
        <i class="bi bi-sun" id="icono-sol" style="display:none"></i>
      </button>
      <div class="alerta-barra" id="alerta-barra" role="status" aria-atomic="true">
        <span class="dot-pulse dot-red"></span>
        <span id="contador-alertas"></span>
      </div>
    </div>
  </header>

  <main class="sat-content">

    <div class="mb-3">
      <div class="page-eyebrow">CONTROL DE CADUCIDAD</div>
      <h1 class="page-heading">Semáforo de caducidad</h1>
      <p class="page-sub"><span id="sem-desc">Estado de cada producto según su lote más próximo a vencer</span> · <span id="today-date"></span></p>
    </div>

    <!-- Resumen de estados: clic en un estado filtra la tabla -->
    <div class="resumen-estados" role="region" aria-label="Resumen de estados">
      <div class="estados-fila">
        <button type="button" class="estado-item rojo" onclick="setFilter('ROJO')">
          <span class="estado-num" id="kpi-rojo">—</span>
          <span><span class="estado-nombre">Rojo</span><span class="estado-desc">Vencen en 7 días o menos</span></span>
        </button>
        <button type="button" class="estado-item amarillo" onclick="setFilter('AMARILLO')">
          <span class="estado-num" id="kpi-amarillo">—</span>
          <span><span class="estado-nombre">Amarillo</span><span class="estado-desc">Vencen en 8 a 30 días</span></span>
        </button>
        <button type="button" class="estado-item verde" onclick="setFilter('VERDE')">
          <span class="estado-num" id="kpi-verde">—</span>
          <span><span class="estado-nombre">Verde</span><span class="estado-desc">Más de 30 días</span></span>
        </button>
      </div>
      <div class="barra-proporcion" aria-hidden="true">
        <span class="rojo" id="prop-rojo"></span><span class="amarillo" id="prop-amarillo"></span><span class="verde" id="prop-verde"></span>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="barra-filtros">
      <div class="barra-busqueda">
        <i class="bi bi-search text-muted"></i>
        <input type="text" id="search-input" placeholder="Buscar producto o proveedor…" oninput="filterTable(this.value)">
      </div>

      <span class="d-flex gap-1">
        <button class="chip-filtro active" data-vista="producto" onclick="setVista('producto')">Por producto</button>
        <button class="chip-filtro"        data-vista="lote"     onclick="setVista('lote')">Por lote</button>
      </span>

      <button class="chip-filtro active-all" data-filter="TODOS" onclick="setFilter('TODOS')">Todos</button>
      <button class="chip-filtro"            data-filter="ROJO"     onclick="setFilter('ROJO')">
        <span class="dot-pulse dot-red"></span> ROJO
      </button>
      <button class="chip-filtro"            data-filter="AMARILLO" onclick="setFilter('AMARILLO')">
        <span class="dot-pulse dot-yellow"></span> AMARILLO
      </button>
      <button class="chip-filtro"            data-filter="VERDE"    onclick="setFilter('VERDE')">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--sem-green);display:inline-block"></span> VERDE
      </button>

      <button class="btn btn-danger btn-sm" onclick="exportCSV()">
        <i class="bi bi-download me-1"></i>Exportar CSV
      </button>
    </div>

    <!-- Main table -->
    <div class="table-responsive">
      <table class="table table-hover align-middle" aria-label="Tabla semáforo de caducidad">
        <thead class="table-light" id="sem-thead"></thead>
        <tbody id="lotes-tbody">
          <tr><td colspan="9" class="text-center py-4 text-muted small">Cargando…</td></tr>
        </tbody>
      </table>

      <div class="d-flex justify-content-between align-items-center px-3 py-2 border-top small text-muted">
        <span id="total-count"></span>
        <span id="valor-total" class="fw-bold text-dark"></span>
      </div>
    </div>

  </main>
</div>

<div id="contenedor-avisos"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/core/config.js"></script>
<script src="../assets/js/core/auth.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/utils/format.js"></script>
<script src="../assets/js/components/sidebar.js"></script>
<script src="../assets/js/pages/semaforo.js"></script>
</body>
</html>
