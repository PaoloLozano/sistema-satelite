server:
  port: 8761

spring:
  application:
    name: ms-eureka
  config:
    import: optional:configserver:http://${CONFIG_HOST:localhost}:8888

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
