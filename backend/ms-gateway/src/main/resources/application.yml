server:
  port: 8080

spring:
  application:
    name: ms-gateway
  config:
    import: optional:configserver:http://${CONFIG_HOST:localhost}:8888

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
