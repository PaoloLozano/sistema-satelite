# Configuración del microservicio ms-cotizaciones
server:
  port: 8084

spring: # Configuración de la aplicación Spring Boot
# Nombre de la aplicación
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/satelite_cotizaciones # URL de conexión a la base de datos PostgreSQL para el microservicio ms-cotizaciones
    username: ${DB_USER:satelite}
    password: ${DB_PASS:satelite123}
    driver-class-name: org.postgresql.Driver
# Configuración de JPA (Java Persistence API) para la persistencia de datos
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
