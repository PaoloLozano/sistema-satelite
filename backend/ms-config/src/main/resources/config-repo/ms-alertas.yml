server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/satelite_alertas
    username: ${DB_USER:satelite}
    password: ${DB_PASS:satelite123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Telegram: el token y el chat ID se definen como variables de entorno al iniciar ms-alertas
telegram:
  token: ${TELEGRAM_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
